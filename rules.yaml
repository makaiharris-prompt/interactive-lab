# Interaction Lab rules. Edit freely: no code changes are needed.
# Vocabulary: see GLOSSARY.md.

# Axes: each Brief takes one value from every Axis below.
# Add, remove or rename values, or add a whole new Axis.
axes:
  trigger:
    - hover
    - click
    - drag
    - scroll
    - cursor proximity
    - keyboard
    - idle (motion study)
  subject:
    - button
    - card
    - list
    - text/type
    - image
    - particles
    - grid
    - nav
    - abstract form
  technique:
    - canvas 2D
    - fragment shader
    - three.js scene
    - SDF
    - verlet/spring physics
    - flow field
    - particle system
    - DOM + CSS only
    - reaction-diffusion
    - metaballs / surface tension
    - curl-noise fluid
    - Bézier / SVG path
    - cellular automaton
    - lens distortion
  feel:
    - springy
    - snappy
    - weighty
    - liquid
    - floaty
    - glitchy
    - tactile
    - eerie
  # The mark everything is drawn with: shape and depth come from mark density.
  marks:
    - dot-matrix
    - halftone
    - stipple particles
    - isolines
    - monospace text
    - hairline vector
  # What the user does to the material, and how it answers.
  verb:
    - pull
    - fling
    - stir
    - erase and heal
    - tilt
    - reveal with light
    - magnify
    - scrub
  # A React Bits component (reactbits.dev) to riff on: its core mechanic is the
  # starting point, and the other Axes reshape it into something new. The full
  # catalogue has ~200; swap any in. Keep it to 20 or fewer values, or the 5%
  # floor becomes an even share and Weights stop steering this Axis.
  inspiration:
    - Magnet (elements pulled toward the cursor)
    - Click Spark (sparks burst from each click)
    - Sticker Peel (a sticker peeling from its corner)
    - Pixel Trail (the cursor leaves a fading pixel trail)
    - Meta Balls (blobs that merge like liquid)
    - Ripple Distortion (ripples that warp what's beneath)
    - Halftone Reveal (an image revealed through halftone dots)
    - Silk (slow, flowing fabric-like light)
    - Dither (dithered, retro-shaded gradients)
    - Magnet Lines (a field of lines that turn toward the cursor)
    - Ferrofluid (spiky fluid drawn toward the cursor)
    - Dot Grid (a dot grid that reacts to the cursor)
    - Text Pressure (letters that swell near the cursor)
    - Decrypted Text (text that scrambles into place)
    - Falling Text (letters that drop with physics)
    - Elastic Slider (a slider that stretches past its ends)
    - Card Swap (a stack of cards that cycles)
    - Shredder (something shredded into strips)
    - Tear Ticket (a ticket torn along its perforation)
    - Sling Button (a button pulled back and let fly)

# Style guide: the overall aesthetic every Interaction aims for, passed to Claude
# as written. Unlike Hard constraints, these are taste, not pass/fail rules.
styleGuide:
  - >-
    Specimen plates: each Interaction is one small living simulation, presented
    like a plate in a scientific notebook. A material governed by real maths,
    drawn in tiny monochrome marks, labelled like an instrument reading.
  - >-
    Plate framing, every time, in small lowercase monospace (ui-monospace,
    Menlo) with "·" as the separator. Top left, a bracketed uppercase label
    naming the specimen, e.g. "[ MERCURY ]". Top right, a terse verb hint,
    e.g. "hover to pull · grab and fling". Bottom left, the governing equation
    of the simulation actually running, e.g. "∂v/∂t = Dv·∇²v + u·v² − (F + k)·v".
    Bottom right, live readouts that change as the user acts, e.g.
    "erased 259 · regrown 179 · step 2 816". Lots of empty space around the
    specimen.
  - >-
    Draw with marks, never fills: dot-matrix, halftone, stipple, isolines,
    monospace text or hairline strokes (the marks Axis). Shape and depth come
    from mark density. No gradients-as-decoration, glow, glass, shadows or
    rounded UI chrome.
  - >-
    Palette: warm charcoal near-black (about #111110), marks in off-white and
    greys (about #d8d6d0 and dimmer), and exactly one accent, a cobalt blue
    (about #3d6bff). The blue only marks what is live: where the pointer
    touches, the active line, the bracket labels. No other colours, no emoji,
    no icons.
  - >-
    Real simulation, not an effect: reaction-diffusion, metaballs, fluid,
    springs, Bézier paths, cellular automata, lenses. The user acts on it like
    a physical material (the verb Axis) and it answers with weight, and
    ideally recovers afterwards: heals, settles, regrows. Text and code can be
    the material too.
  - >-
    Each Brief also names a React Bits component to riff on (the inspiration
    Axis). Take its core mechanic as the seed and render it as a specimen
    plate: a sibling of that component in this style, never a copy of it.

# Hard constraints: prose rules every Interaction must follow, passed to Claude as written.
hardConstraints:
  - >-
    One self-contained index.html. The only external import allowed is a library
    from the allow-list below, loaded through the Gallery's import map.
  - Works with both mouse and touch.
  - Respects prefers-reduced-motion.
  - At most about 300 lines.
  - Must pass the Smoke check.

# Library allow-list: the only libraries an Interaction may import.
# Each one must be vendored in vendor/<name>/ with an index.js entry point; the
# Gallery's import map then resolves `<name>` and `<name>/...` to it.
libraries:
  - three
