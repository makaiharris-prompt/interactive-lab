<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hangs on pointer move</title></head>
<body style="margin:0;height:100vh;background:#123">
<div style="position:absolute;inset:25%;background:#fc3;border-radius:24px"></div>
<script>
  addEventListener("pointermove", () => {
    for (;;) {} // blocks the main thread forever
  });
</script>
</body>
</html>
