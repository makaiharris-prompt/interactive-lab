<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodestone Press</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d0e; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, -apple-system, "Inter", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #label {
    position: fixed; left: 0; top: 0; pointer-events: none;
    font-size: 11px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: #1a1918;
    white-space: nowrap; will-change: transform;
  }
  #hint { position: fixed; left: 20px; bottom: 18px; font-size: 11px; letter-spacing: .08em; color: #5d5a57; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">press</div>
<div id="hint">a lodestone keeps visiting · touch to take it</div>
<script>
const canvas = document.getElementById("c");
const label = document.getElementById("label");
const gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PX = 2; // each dither cell is 2 CSS pixels

const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const fs = `
precision highp float;
uniform vec2 uRes, uC, uM;
uniform float uPress, uT, uPull;
float sdRBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float smin(float a, float b, float k){ k = max(k, 1e-4); float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
float button(vec2 p){
  float s = 1. - .07 * uPress;
  return sdRBox(p - uC, vec2(.21, .072) * s, .072 * s);
}
float scene(vec2 p){
  float m = length(p - uM) - .016;
  return smin(button(p), m, .13 * uPull);
}
float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
float bayer4(vec2 a){ return bayer2(.5 * a) * .25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(.5 * a) * .25 + bayer2(a); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  float d = scene(p);
  vec2 e = vec2(.002, 0.);
  vec2 g = normalize(vec2(scene(p + e.xy) - scene(p - e.xy), scene(p + e.yx) - scene(p - e.yx)) + 1e-6);
  // background: soft vignette, the button's cast shadow, the lodestone's glow
  float lum = .085 - .07 * length(p * vec2(.8, 1.));
  float sh = scene(p + vec2(-.012, .03) * (1. - uPress));
  lum -= .11 * (1. - smoothstep(-.02, .09, sh));
  float md = length(p - uM);
  float glow = .012 / (md + .02);
  lum += glow * .5;
  vec3 tint = vec3(0.);
  if (d < 0.) {
    // embossed cap: edges tilt toward the light, the press turns the bevel inward
    float rim = 1. - clamp(-d / .035, 0., 1.);
    float tilt = rim * mix(1.4, -.9, uPress);
    vec3 n = normalize(vec3(-g * tilt, 1.));
    float l = dot(n, normalize(vec3(-.55, .65, .75)));
    lum = .26 + .55 * l - .12 * uPress + glow * .35;
    lum += .08 * smoothstep(.0, -.2, -length(p - uM) + .05) * uPull;
  }
  lum += (hash(gl_FragCoord.xy + fract(uT) * 91.) - .5) * .07; // grain
  float q = floor(clamp(lum, 0., 1.) * 4. + bayer8(gl_FragCoord.xy)) / 4.;
  vec3 ink = vec3(.05, .05, .055), paper = vec3(.86, .84, .8), amber = vec3(1., .52, .22);
  vec3 col = mix(ink, paper, q);
  float heat = smoothstep(.12, .0, md) * (d < 0. ? .35 : 1.);
  col = mix(col, amber * (q + .2), clamp(heat * q * 1.4, 0., .85));
  gl_FragColor = vec4(col, 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "a");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ["uRes", "uC", "uM", "uPress", "uT", "uPull"]) U[n] = gl.getUniformLocation(prog, n);

let W = 0, H = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = Math.ceil(W / PX); canvas.height = Math.ceil(H / PX);
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (reduce) frame(performance.now());
}

// state: magnet M, button centre C with velocity, press with velocity
const M = { x: .38, y: .12 }, C = { x: 0, y: 0, vx: 0, vy: 0 }, P = { v: 0, vel: 0 };
let pointer = null, lastInput = -1e9, held = false, prev = performance.now();

function autoMagnet(t) {
  const s = t / 1000;
  const phase = (s / 6.5) % 1;
  const dip = smooth(.5, .66, phase) * (1 - smooth(.74, .92, phase));
  const a = s * .45 + Math.sin(s * .23) * .8;
  const r = (.4 + .08 * Math.sin(s * .37)) * (1 - .78 * dip);
  return { x: Math.cos(a) * r * 1.25, y: Math.sin(a) * r * .8 };
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function sdBox(px, py) { // button distance in JS, matches the shader closely enough for contact tests
  const qx = Math.abs(px - C.x) - .21 + .072, qy = Math.abs(py - C.y) - .072 + .072;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - .072;
}

function frame(t) {
  const dt = Math.min(.033, (t - prev) / 1000); prev = t;
  const target = pointer && t - lastInput < 2500 ? pointer : autoMagnet(t);
  const follow = reduce ? 1 : 1 - Math.exp(-dt * 9);
  M.x += (target.x - M.x) * follow; M.y += (target.y - M.y) * follow;

  const dx = M.x - C.x, dy = M.y - C.y, dist = Math.hypot(dx, dy) + 1e-4;
  const edge = sdBox(M.x, M.y);
  const pull = Math.exp(-Math.max(edge, 0) * 9);
  const tx = dx / dist * .045 * pull, ty = dy / dist * .045 * pull;
  const pressTarget = held || edge < .004 ? 1 : 0;
  if (reduce) {
    C.x = tx; C.y = ty; P.v = pressTarget;
  } else { // stiff, slightly underdamped springs read as tactile
    C.vx += ((tx - C.x) * 220 - C.vx * 19) * dt; C.vy += ((ty - C.y) * 220 - C.vy * 19) * dt;
    C.x += C.vx * dt; C.y += C.vy * dt;
    P.vel += ((pressTarget - P.v) * 600 - P.vel * 30) * dt; P.v += P.vel * dt;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uC, C.x, C.y); gl.uniform2f(U.uM, M.x, M.y);
  gl.uniform1f(U.uPress, Math.max(0, Math.min(1.2, P.v)));
  gl.uniform1f(U.uPull, pull); gl.uniform1f(U.uT, reduce ? 0 : t / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const s = 1 - .07 * P.v;
  label.style.transform = `translate(${W / 2 + C.x * H}px, ${H / 2 - C.y * H}px) translate(-50%, -50%) scale(${s})`;
  label.style.opacity = .55 + .45 * P.v;
  if (!reduce) requestAnimationFrame(frame);
}

function toScene(e) { return { x: (e.clientX - W / 2) / H, y: (H / 2 - e.clientY) / H }; }
addEventListener("pointermove", e => { pointer = toScene(e); lastInput = performance.now(); if (reduce) frame(lastInput); });
addEventListener("pointerdown", e => {
  pointer = toScene(e); lastInput = performance.now();
  held = sdBox(pointer.x, pointer.y) < .03;
  if (reduce) frame(lastInput);
});
addEventListener("pointerup", () => { held = false; if (reduce) frame(performance.now()); });
addEventListener("pointercancel", () => { held = false; });
addEventListener("resize", resize);

resize();
if (reduce) { M.x = .26; M.y = .07; frame(performance.now()); } else requestAnimationFrame(frame);
</script>
</body>
</html>
