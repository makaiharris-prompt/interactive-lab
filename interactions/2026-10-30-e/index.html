<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swelling Horizon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #110f1c; }
  body { touch-action: none; font-family: system-ui, -apple-system, "Inter", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint { position: fixed; left: 20px; bottom: 18px; font-size: 11px; letter-spacing: .08em; color: #5b5470; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">hover to read the picture</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BG = "#110f1c", INK = "#f3cfae";
const GAP = 7, STEP = 4; // row spacing and sample spacing, CSS px

// The picture: a procedural moonrise over ridges and a still lake, kept as luminance only.
const IW = 240, IH = 180;
const img = new Float32Array(IW * IH);
(function paint() {
  const ridge = (x, k) => .5 + .07 * Math.sin(x * 5.1 + k) + .04 * Math.sin(x * 13.7 + k * 2) + .015 * Math.sin(x * 41 + k);
  for (let j = 0; j < IH; j++) for (let i = 0; i < IW; i++) {
    const x = i / IW, y = j / IH;
    let v = .05 + .42 * (1 - y / .62) ** 2;                      // sky glow toward the horizon
    const md = Math.hypot((x - .63) * 1.33, y - .3);
    v += md < .085 ? .9 : .25 * Math.exp(-(((md - .085) * 9) ** 2)) + .18 * Math.exp(-md * 5);
    if (y > ridge(x, 1) - .07) v = .14 + .08 * (1 - x);             // far ridge
    if (y > ridge(x * 1.3, 4) + .03) v = .015;                    // near ridge
    if (y > .66) {                                                // lake: mirror above, darken, ripple
      const ry = .66 - (y - .66) * 1.1 + .004 * Math.sin(y * 300);
      const mi = Math.min(IW - 1, Math.max(0, Math.round((x + .003 * Math.sin(y * 170)) * IW)));
      const mj = Math.min(IH - 1, Math.max(0, Math.round(ry * IH)));
      v = img[mj * IW + mi] * .62;
    }
    img[j * IW + i] = Math.min(1, v);
  }
})();
function lum(x, y) { // x, y in 0..1, cover-fit sample
  const i = Math.min(IW - 1, Math.max(0, x * IW | 0)), j = Math.min(IH - 1, Math.max(0, y * IH | 0));
  return img[j * IW + i];
}

let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (reduce) draw(performance.now());
}

// The lens drifts after the pointer on a soft, underdamped spring (floaty).
const lens = { x: 0, y: 0, vx: 0, vy: 0, r: 0, power: 0 };
let target = null, lastMove = -1e9, prev = performance.now();

function idleTarget(t) {
  const s = t / 1000;
  return { x: W * (.5 + .28 * Math.sin(s * .21)), y: H * (.42 + .14 * Math.sin(s * .33 + 1)) };
}

function draw(t) {
  const dt = Math.min(.033, (t - prev) / 1000); prev = t;
  const active = target && t - lastMove < 3000;
  const goal = active ? target : idleTarget(t);
  if (reduce) { lens.x = goal.x; lens.y = goal.y; lens.power = 1; }
  else {
    lens.vx += ((goal.x - lens.x) * 14 - lens.vx * 4.2) * dt;
    lens.vy += ((goal.y - lens.y) * 14 - lens.vy * 4.2) * dt;
    lens.x += lens.vx * dt; lens.y += lens.vy * dt;
    lens.power += ((active ? 1 : .7) - lens.power) * (1 - Math.exp(-dt * 2));
  }
  const s = reduce ? 0 : t / 1000;
  const R = Math.min(W, H) * (.24 + (reduce ? 0 : .02 * Math.sin(s * .9)));
  const inv = 1 / (R * R);

  // cover-fit the picture to the viewport
  const scale = Math.max(W / IW, H / IH), ox = (W - IW * scale) / 2, oy = (H - IH * scale) / 2;

  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(lens.x, lens.y, 0, lens.x, lens.y, R * 1.6);
  glow.addColorStop(0, "rgba(120, 90, 170, .16)"); glow.addColorStop(1, "rgba(120, 90, 170, 0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = INK;
  const top = [], bot = [];
  for (let y0 = GAP / 2; y0 < H + GAP; y0 += GAP) {
    top.length = 0; bot.length = 0;
    for (let x = -STEP; x <= W + STEP; x += STEP) {
      const dx = x - lens.x, dy = y0 - lens.y;
      const p = Math.exp(-(dx * dx + dy * dy) * inv) * lens.power;   // pressure, 0..1
      const v = lum((x - ox) / scale / IW, (y0 - oy) / scale / IH);
      const lift = p * 2.2 + (reduce ? 0 : Math.sin(x * .012 + y0 * .03 + s * .8) * .6 * (1 - p));
      const h = Math.max(.25, GAP * .92 * v * (.14 + .86 * p));       // weight swells under pressure
      const cy = y0 - lift;
      top.push(x, cy - h / 2); bot.push(x, cy + h / 2);
    }
    ctx.beginPath();
    ctx.moveTo(top[0], top[1]);
    for (let k = 2; k < top.length; k += 2) ctx.lineTo(top[k], top[k + 1]);
    for (let k = bot.length - 2; k >= 0; k -= 2) ctx.lineTo(bot[k], bot[k + 1]);
    ctx.closePath(); ctx.fill();
  }
  if (!reduce) requestAnimationFrame(draw);
}

function move(e) { target = { x: e.clientX, y: e.clientY }; lastMove = performance.now(); if (reduce) draw(lastMove); }
addEventListener("pointermove", move);
addEventListener("pointerdown", move);
addEventListener("resize", resize);

resize();
const start = idleTarget(performance.now());
lens.x = start.x; lens.y = start.y; lens.power = .7;
draw(performance.now());
</script>
</body>
</html>
