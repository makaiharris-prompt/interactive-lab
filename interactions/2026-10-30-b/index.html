<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disturb the Pond</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2a2a; }
  body { touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="module">
import * as THREE from "three";

const reduce = matchMedia("(prefers-reduced-motion: reduce)");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1000, 1000);
camera.position.z = 100;

const sun = new THREE.DirectionalLight(0xdff6ff, 1.1);
sun.position.set(0.9, 0.9, 0.35);
scene.add(sun);

// The image: painted once per size on a canvas, shown through the emissive
// channel so it reads true, while the light only adds glints where the
// surface tilts.
const paper = document.createElement("canvas");
const tex = new THREE.CanvasTexture(paper);
tex.colorSpace = THREE.SRGBColorSpace;
const material = new THREE.MeshPhongMaterial({
  color: 0x000000, emissive: 0xffffff, emissiveMap: tex,
  specular: 0x8fb8c0, shininess: 60,
});

let mesh, W, H, cols, rows, gap, rest, pos, prev;
const MARGIN = 0.06;

function rng(seed) {
  return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
}

function paint(w, h) {
  const s = Math.min(1, 1400 / Math.max(w, h));
  paper.width = Math.round(w * s);
  paper.height = Math.round(h * s);
  const g = paper.getContext("2d");
  const pw = paper.width, ph = paper.height, u = Math.min(pw, ph);
  const r = rng(7);

  const water = g.createRadialGradient(pw * 0.35, ph * 0.3, 0, pw * 0.5, ph * 0.5, Math.max(pw, ph) * 0.8);
  water.addColorStop(0, "#2f8a86");
  water.addColorStop(0.5, "#15514f");
  water.addColorStop(1, "#08201f");
  g.fillStyle = water;
  g.fillRect(0, 0, pw, ph);

  // caustic threads
  g.strokeStyle = "rgba(170,240,225,0.07)";
  g.lineWidth = u * 0.004;
  for (let i = 0; i < 70; i++) {
    g.beginPath();
    let x = r() * pw, y = r() * ph;
    g.moveTo(x, y);
    for (let j = 0; j < 4; j++) g.quadraticCurveTo(x + (r() - 0.5) * u * 0.2, y + (r() - 0.5) * u * 0.2, x += (r() - 0.5) * u * 0.15, y += (r() - 0.5) * u * 0.15);
    g.stroke();
  }

  const koi = [[0.3, 0.42, 0.4, "#ff7a2f"], [0.62, 0.62, 2.6, "#f4f0e6"], [0.72, 0.3, 3.6, "#ff5a36"], [0.45, 0.75, 5.5, "#ffb23f"]];
  for (const [x, y, a, c] of koi) fish(g, x * pw, y * ph, a, u * 0.11, c, r);

  const pads = [[0.12, 0.2, 0.09], [0.86, 0.78, 0.12], [0.18, 0.82, 0.07], [0.9, 0.15, 0.06], [0.55, 0.12, 0.05]];
  for (const [x, y, rad] of pads) {
    const R = rad * u * 1.4, a0 = r() * Math.PI * 2;
    g.fillStyle = "rgba(0,0,0,0.25)";
    g.beginPath(); g.ellipse(x * pw + R * 0.08, y * ph + R * 0.1, R, R, 0, 0, Math.PI * 2); g.fill();
    const pad = g.createRadialGradient(x * pw, y * ph, 0, x * pw, y * ph, R);
    pad.addColorStop(0, "#7cc35a"); pad.addColorStop(1, "#2f6e2c");
    g.fillStyle = pad;
    g.beginPath(); g.moveTo(x * pw, y * ph); g.arc(x * pw, y * ph, R, a0 + 0.3, a0 + Math.PI * 2 - 0.3); g.closePath(); g.fill();
    g.strokeStyle = "rgba(20,60,20,0.35)"; g.lineWidth = u * 0.002;
    for (let k = 0; k < 7; k++) {
      const a = a0 + 0.5 + k * 0.8;
      g.beginPath(); g.moveTo(x * pw, y * ph); g.lineTo(x * pw + Math.cos(a) * R * 0.9, y * ph + Math.sin(a) * R * 0.9); g.stroke();
    }
  }
  tex.needsUpdate = true;
}

function fish(g, x, y, ang, len, color, r) {
  g.save();
  g.translate(x, y); g.rotate(ang);
  g.fillStyle = "rgba(0,10,10,0.3)";
  g.beginPath(); g.ellipse(len * 0.06, len * 0.08, len * 0.5, len * 0.17, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = color;
  g.beginPath(); g.moveTo(-len * 0.45, 0);
  g.quadraticCurveTo(-len * 0.8, -len * 0.25, -len * 0.75, 0);
  g.quadraticCurveTo(-len * 0.8, len * 0.25, -len * 0.45, 0); g.fill();
  g.beginPath(); g.ellipse(0, 0, len * 0.5, len * 0.16, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(len * 0.05, -len * 0.17, len * 0.12, len * 0.06, -0.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(len * 0.05, len * 0.17, len * 0.12, len * 0.06, 0.5, 0, Math.PI * 2); g.fill();
  g.fillStyle = color === "#f4f0e6" ? "#e8402a" : "#fff6ea";
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.ellipse((r() - 0.4) * len * 0.6, (r() - 0.5) * len * 0.12, len * 0.09, len * 0.06, r(), 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

function build() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  Object.assign(camera, { left: -W / 2, right: W / 2, top: H / 2, bottom: -H / 2 });
  camera.updateProjectionMatrix();
  paint(W, H);

  const pw = W * (1 + MARGIN * 2), ph = H * (1 + MARGIN * 2);
  gap = Math.max(pw, ph) / 64;
  cols = Math.ceil(pw / gap) + 1;
  rows = Math.ceil(ph / gap) + 1;
  const geo = new THREE.PlaneGeometry(pw, ph, cols - 1, rows - 1);
  // stretch the margin so the visible area maps to the whole painting
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (uv.getX(i) - 0.5) * (1 + MARGIN * 2) + 0.5, (uv.getY(i) - 0.5) * (1 + MARGIN * 2) + 0.5);
  }
  tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping;
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  mesh = new THREE.Mesh(geo, material);
  scene.add(mesh);
  rest = Float32Array.from(geo.attributes.position.array);
  pos = new Float32Array(rest.length);   // displacement (x, y, z) per node
  prev = new Float32Array(rest.length);
}

// Pointer: hovering stirs the water along the pointer's path.
let px = null, py = null;
function stir(x, y) {
  const wx = x - W / 2, wy = H / 2 - y;
  if (px !== null) {
    const vx = wx - px, vy = wy - py, R = Math.min(W, H) * 0.09;
    const gain = reduce.matches ? 0.3 : 0.9;
    for (let i = 0; i < rest.length; i += 3) {
      const dx = rest[i] - wx, dy = rest[i + 1] - wy, d2 = dx * dx + dy * dy;
      if (d2 > R * R) continue;
      const f = 1 - Math.sqrt(d2) / R, f2 = f * f * gain;
      prev[i] -= vx * f2;
      prev[i + 1] -= vy * f2;
      prev[i + 2] += Math.min(Math.hypot(vx, vy), 40) * f2 * 1.8;
    }
  }
  px = wx; py = wy;
}
addEventListener("pointermove", (e) => stir(e.clientX, e.clientY));
addEventListener("pointerdown", (e) => { px = null; stir(e.clientX, e.clientY); });
const lift = () => { px = null; };
addEventListener("pointerleave", lift);
addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") lift(); });

function drop() {
  const i = 3 * Math.floor(Math.random() * (rest.length / 3));
  prev[i + 2] += 30;
}

function step() {
  const calm = reduce.matches;
  const anchor = calm ? 0.03 : 0.012, couple = calm ? 0.1 : 0.2, damp = calm ? 0.8 : 0.97;
  const n = pos.length;
  const next = new Float32Array(n);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = (r * cols + c) * 3;
      if (r === 0 || c === 0 || r === rows - 1 || c === cols - 1) continue;
      for (let k = 0; k < 3; k++) {
        const p = pos[i + k];
        const lap = pos[i + k - 3] + pos[i + k + 3] + pos[i + k - cols * 3] + pos[i + k + cols * 3] - 4 * p;
        next[i + k] = p + (p - prev[i + k]) * damp + lap * couple - p * anchor;
      }
    }
  }
  prev = pos; pos = next;
}

function frame() {
  if (!reduce.matches && Math.random() < 0.03) drop();
  step();
  const arr = mesh.geometry.attributes.position.array;
  for (let i = 0; i < arr.length; i++) arr[i] = rest[i] + pos[i];
  mesh.geometry.attributes.position.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", build);
build();
frame();
</script>
</body>
</html>
